- id: graduate
  title: Graduate Students
  members:
    # TODO: template entries; fill in or delete once member info is collected.
    - name: Americo Gamarra
      role: PhD Student, Geospatial Information Science
      image: people/AmericoGamarra.jpeg
      email: Americo.Gamarra@UTDallas.edu
      bio: Americo is a Ph.D. student in Geospatial Information Sciences at The University of Texas at Dallas. He holds a M.S. in GIS from Penn State University. His research lies at the intersection of GIScience, remote sensing, and data science, with a focus on applying machine learning and deep learning to detect and map oil and gas infrastructure from remotely sensed imagery. His hands-on experience includes spatial databases, web GIS, and the development of mapping tools and applications in the ArcGIS ecosystem using Python, JavaScript, and C#.
    - name: Kwadwo Frimpong
      role: PhD Student, Geospatial Information Science
      image: people/KwadwoFrimpong.jpeg
      email: Kwadwo.Frimpong@UTDallas.edu
      bio: My research lies at the intersection of GIScience, remote sensing, and climate change adaptation, with a focus on land use/cover change, land surface temperature, heat stress, and thermal comfort in urban environments. My work integrates machine learning, spatial statistics, and climate indices to examine the impacts of global and local drivers on heat stress exposure and resilience.
    - name: Jiacheng Zhang
      role: PhD Student, Geospatial Information Sciences
      image: people/JiachengZhang.JPG
      email: Jiacheng.Zhang@UTDallas.edu
      bio: Jiacheng Zhang is a Ph.D. student in Geospatial Information Sciences at the University of Texas at Dallas. He earned his M.S. in Geographic Information Science from the University of Illinois Urbana-Champaign (2024) and his B.S. in Land Resource Management from Qufu Normal University(2023). His research focuses on CyberGIS and geospatial data science, emphasizing the integration of advanced geospatial technologies to address complex spatial challenges.

